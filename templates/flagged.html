{% extends "base.html" %}
{% block content %}
<div class="row mt-4">
    <div class="col-12">
        <h2>🚨 Flagged Projects</h2>
        <p class="text-muted">Projects flagged for further investigation</p>
    </div>
</div>

<div class="card mt-3">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Project</th>
                        <th>District</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>Severity</th>
                    </tr>
                </thead>
                <tbody id="flaggedTableBody">
                    <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    fetch('/api/flagged')
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('flaggedTableBody');
            if (!data || !data.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No flagged projects yet</td></tr>';
                return;
            }
            tbody.innerHTML = data.map((p, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td>${p.work_name || p.name || 'Unknown'}</td>
                    <td>${p.district || 'N/A'}</td>
                    <td>₹${((p.sanction_amount || p.amount || 0)/100000).toFixed(1)}L</td>
                    <td><span class="badge bg-warning text-dark">${p.anomaly_type || p.type || 'flagged'}</span></td>
                    <td>${p.severity || 'N/A'}</td>
                </tr>
            `).join('');
        })
        .catch(err => {
            document.getElementById('flaggedTableBody').innerHTML = 
                '<tr><td colspan="6" class="text-center text-danger">Error loading data</td></tr>';
        });
});
</script>
{% endblock %}

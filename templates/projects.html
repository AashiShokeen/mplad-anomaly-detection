{% extends "base.html" %}
{% block content %}
<div class="row mt-4">
    <div class="col-12">
        <h2>📋 All Projects</h2>
        <p class="text-muted">Browse all MPLAD projects</p>
    </div>
</div>

<div class="card mt-3">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Project</th>
                        <th>District</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="projectsTableBody">
                    <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    fetch('/api/projects')
        .then(r => r.json())
        .then(data => {
            const tbody = document.getElementById('projectsTableBody');
            if (!data || !data.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No projects found</td></tr>';
                return;
            }
            tbody.innerHTML = data.slice(0, 100).map((p, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td>${p.name || 'Unknown'}</td>
                    <td>${p.district || 'N/A'}</td>
                    <td>${p.work_category || 'N/A'}</td>
                    <td>₹${((p.amount || 0)/100000).toFixed(1)}L</td>
                    <td><span class="badge bg-secondary">${p.work_status || 'unknown'}</span></td>
                </tr>
            `).join('');
        })
        .catch(err => {
            document.getElementById('projectsTableBody').innerHTML = 
                '<tr><td colspan="6" class="text-center text-danger">Error loading</td></tr>';
        });
});
</script>
{% endblock %}

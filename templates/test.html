<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <div class="container">
        <h2>🔌 API Test Page</h2>
        <p class="text-muted">Click buttons to test API endpoints</p>
        
        <div class="mb-3">
            <button class="btn btn-primary" onclick="testProjects()">Load Projects</button>
            <button class="btn btn-warning" onclick="testFlagged()">Load Flagged</button>
            <button class="btn btn-success" onclick="testStats()">Load Stats</button>
            <button class="btn btn-secondary" onclick="clearResults()">Clear</button>
        </div>
        
        <div class="card">
            <div class="card-header">API Response</div>
            <div class="card-body">
                <pre id="result" style="max-height: 500px; overflow: auto;">Waiting for data...</pre>
            </div>
        </div>
    </div>

    <script>
        async function testProjects() {
            document.getElementById('result').textContent = 'Loading...';
            try {
                const data = await fetchProjects();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error;
            }
        }

        async function testFlagged() {
            document.getElementById('result').textContent = 'Loading...';
            try {
                const data = await fetchFlaggedProjects();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error;
            }
        }

        async function testStats() {
            document.getElementById('result').textContent = 'Loading...';
            try {
                const data = await fetchDashboardStats();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error;
            }
        }

        function clearResults() {
            document.getElementById('result').textContent = 'Cleared';
        }
    </script>
    <script src="/static/js/api.js"></script>
</body>
</html>

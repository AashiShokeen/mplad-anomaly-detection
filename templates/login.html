<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MPLAD Anomaly Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root{
            --navy-deep:   #061428;
            --navy:        #0B2545;
            --navy-card:   #0E2F58;
            --blue:        #1B6FD6;
            --teal:        #17C3B2;
            --orange:      #FF7A29;
            --ink-light:   #DCE7F5;
            --ink-mute:    #7E93B3;
        }
 
        *{ box-sizing: border-box; }
 
        html, body{
            height: 100%;
        }
 
        body{
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(1200px 800px at 15% -10%, #123a6b 0%, transparent 55%),
                        radial-gradient(1000px 700px at 110% 10%, #0d4a45 0%, transparent 50%),
                        linear-gradient(160deg, var(--navy-deep) 0%, #081b34 55%, #061020 100%);
            overflow: hidden;
            position: relative;
        }
 
        /* ---------- animated background layers ---------- */
 
        #bg-canvas{
            position: fixed;
            inset: 0;
            z-index: 0;
            display: block;
        }
 
        .scan-line{
            position: fixed;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(23,195,178,.55), transparent);
            z-index: 1;
            animation: scan 6s linear infinite;
            pointer-events: none;
        }
 
        @keyframes scan{
            0%   { top: -2%; opacity: 0; }
            8%   { opacity: .9; }
            92%  { opacity: .9; }
            100% { top: 102%; opacity: 0; }
        }
 
        .orbit-blob{
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .35;
            z-index: 0;
            pointer-events: none;
        }
        .orbit-blob.b1{
            width: 420px; height: 420px;
            background: var(--blue);
            top: -120px; left: -120px;
            animation: drift1 22s ease-in-out infinite;
        }
        .orbit-blob.b2{
            width: 380px; height: 380px;
            background: var(--teal);
            bottom: -140px; right: -100px;
            animation: drift2 26s ease-in-out infinite;
        }
        .orbit-blob.b3{
            width: 260px; height: 260px;
            background: var(--orange);
            top: 55%; left: 60%;
            opacity: .18;
            animation: drift3 30s ease-in-out infinite;
        }
 
        @keyframes drift1{
            0%,100% { transform: translate(0,0); }
            50%     { transform: translate(60px, 80px); }
        }
        @keyframes drift2{
            0%,100% { transform: translate(0,0); }
            50%     { transform: translate(-70px, -50px); }
        }
        @keyframes drift3{
            0%,100% { transform: translate(0,0) scale(1); }
            50%     { transform: translate(-40px, 40px) scale(1.15); }
        }
 
        /* ---------- shell / header ---------- */
 
        .page-shell{
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
 
        .brand-bar{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 28px 20px 6px;
        }
 
        .brand-mark{
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--blue), var(--teal));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 18px;
            box-shadow: 0 0 22px rgba(23,195,178,.45);
            flex-shrink: 0;
        }
 
        .brand-name{
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: .3px;
            color: var(--ink-light);
        }
        .brand-name span{ color: var(--orange); }
 
        .brand-tag{
            text-align: center;
            color: var(--ink-mute);
            font-size: .82rem;
            margin-bottom: 18px;
            letter-spacing: .2px;
        }
 
        /* ---------- login card ---------- */
 
        .login-wrap{
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px 40px;
        }
 
        .login-card{
            width: 100%;
            max-width: 380px;
            background: linear-gradient(180deg, rgba(20,49,88,.85), rgba(9,26,49,.9));
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px;
            padding: 34px 32px 28px;
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(23,195,178,.05);
            position: relative;
            animation: rise .6s ease-out;
        }
 
        @keyframes rise{
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
 
        .login-card::before{
            content: "";
            position: absolute;
            top: 0; left: 18px; right: 18px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(23,195,178,.7), transparent);
        }
 
        .login-icon{
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #1c4d86, #0a2038);
            border: 1px solid rgba(23,195,178,.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            position: relative;
        }
        .login-icon::after{
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(23,195,178,.25);
            animation: pulse-ring 2.6s ease-out infinite;
        }
        @keyframes pulse-ring{
            0%   { transform: scale(.85); opacity: .8; }
            80%  { transform: scale(1.35); opacity: 0; }
            100% { opacity: 0; }
        }
 
        .login-title{
            text-align: center;
            color: var(--ink-light);
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 2px;
        }
        .login-sub{
            text-align: center;
            color: var(--ink-mute);
            font-size: .8rem;
            margin-bottom: 22px;
        }
 
        .form-label{
            color: var(--ink-mute);
            font-size: .78rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
 
        .form-control{
            background: rgba(6,20,40,.6);
            border: 1px solid rgba(255,255,255,.12);
            color: var(--ink-light);
            padding: 10px 14px;
            border-radius: 9px;
            font-size: .92rem;
        }
        .form-control:focus{
            background: rgba(6,20,40,.85);
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(23,195,178,.15);
            color: var(--ink-light);
        }
        .form-control::placeholder{ color: #5c7392; }
 
        .btn-login{
            width: 100%;
            border: none;
            padding: 11px;
            border-radius: 9px;
            font-weight: 600;
            font-size: .95rem;
            color: #fff;
            background: linear-gradient(90deg, var(--blue), var(--teal));
            background-size: 200% 100%;
            transition: background-position .5s ease, transform .15s ease;
            margin-top: 6px;
        }
        .btn-login:hover{
            background-position: 100% 0;
            transform: translateY(-1px);
            color: #fff;
        }
        .btn-login:active{ transform: translateY(0); }
 
        .demo-note{
            text-align: center;
            margin-top: 16px;
            font-size: .76rem;
            color: var(--ink-mute);
        }
        .demo-note code{
            background: rgba(255,122,41,.12);
            color: var(--orange);
            padding: 2px 7px;
            border-radius: 5px;
        }
 
        .footer-strip{
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 10px;
            font-size: .72rem;
            color: rgba(220,231,245,.55);
            letter-spacing: .3px;
        }
    </style>
</head>
<body>
 
    <canvas id="bg-canvas"></canvas>
    <div class="scan-line"></div>
    <div class="orbit-blob b1"></div>
    <div class="orbit-blob b2"></div>
    <div class="orbit-blob b3"></div>
 
    <div class="page-shell">
 
        <div class="brand-bar">
            <div class="brand-mark">AX</div>
            <div class="brand-name">Anomaly <span>X</span></div>
        </div>
        <div class="brand-tag">AI-Powered Intelligence for MPLAD</div>
 
        <div class="login-wrap">
            <div class="login-card">
                <div class="login-icon">🏛️</div>
                <div class="login-title">MPLAD Anomaly Detection</div>
                <div class="login-sub">Sign in to your dashboard</div>
 
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">USERNAME</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">PASSWORD</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn-login">Login</button>
                </form>
 
                <div class="demo-note">
                    Demo credentials: <code>admin / admin123</code>
                </div>
            </div>
        </div>
 
        <div class="footer-strip">Transparent MPLAD. Stronger India.</div>
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Animated node-network background, echoing the "data intelligence" theme
        (function(){
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let w, h, nodes;
 
            function resize(){
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();
 
            const NODE_COUNT = Math.min(70, Math.floor((w * h) / 22000));
            nodes = Array.from({length: NODE_COUNT}, () => ({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35,
                r: Math.random() * 1.6 + 0.6
            }));
 
            const LINK_DIST = 130;
 
            function step(){
                ctx.clearRect(0, 0, w, h);
 
                for(const n of nodes){
                    n.x += n.vx;
                    n.y += n.vy;
                    if(n.x < 0 || n.x > w) n.vx *= -1;
                    if(n.y < 0 || n.y > h) n.vy *= -1;
                }
 
                for(let i = 0; i < nodes.length; i++){
                    for(let j = i + 1; j < nodes.length; j++){
                        const a = nodes[i], b = nodes[j];
                        const dx = a.x - b.x, dy = a.y - b.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if(dist < LINK_DIST){
                            ctx.strokeStyle = `rgba(23,195,178,${(1 - dist / LINK_DIST) * 0.18})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                }
 
                for(const n of nodes){
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(120,180,255,0.5)';
                    ctx.fill();
                }
 
                requestAnimationFrame(step);
            }
            step();
        })();
    </script>
</body>
</html>
